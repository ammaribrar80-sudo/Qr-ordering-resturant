<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Your order — Barbeque Nation</title>
  <meta name="theme-color" content="#f7f3ea">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css?v=3">
  <link rel="stylesheet" href="/css/menu.css?v=2">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%231f3d2f'/><text x='50' y='70' font-size='58' font-family='Georgia' text-anchor='middle' fill='%23f7f3ea'>C</text></svg>">
</head>
<body class="order-page">
  <header class="site-head">
    <div class="wrap head-inner">
      <a class="brand" href="/">
        <span class="brand-mark">C</span>
        <span class="brand-text">
          <strong id="brandName">Barbeque Nation</strong>
          <span>Order tracking</span>
        </span>
      </a>
      <a class="btn btn-ghost btn-sm" id="backToMenu" href="/menu">Back to menu</a>
    </div>
  </header>

  <main class="order-shell" id="orderShell">
    <div class="order-loading">
      <span class="spinner" aria-hidden="true"></span>
      <p>Finding your order…</p>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/js/order.js"></script>
</body>
</html>
