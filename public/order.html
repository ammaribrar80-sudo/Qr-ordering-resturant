<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Order Tracking — Barbeque Nation</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/menu.css">
  <style>
    .order-status-banner {
      padding: 16px;
      border-radius: var(--radius-md);
      text-align: center;
      margin-bottom: 24px;
      font-weight: 600;
      font-size: 15px;
    }
    .banner-new { background: #e8f4fd; color: #1e6091; border: 1px solid #bce0fd; }
    .banner-preparing { background: #fef9e7; color: #b78103; border: 1px solid #fae8a4; }
    .banner-ready { background: #eafaf1; color: #1e8449; border: 1px solid #a9dfbf; }
    .banner-completed { background: #f2f3f4; color: #566573; border: 1px solid #d5d8dc; }
    .banner-cancelled { background: #fdedec; color: #a93226; border: 1px solid #f5b7b1; }
  </style>
</head>
<body style="background: var(--cream); min-height: 100vh; padding: 24px 16px 60px;">

  <div style="max-width: 600px; margin: 0 auto; text-align: center; margin-bottom: 24px;">
    <h1 style="font-family: var(--font-serif); font-size: 28px; color: var(--ink);" id="resName">Barbeque Nation</h1>
    <p style="font-size: 14px; color: var(--muted);" id="resOutlet">Live Order Tracking</p>
  </div>

  <main class="order-tracking-card" id="trackingContainer">
    <div style="text-align:center; padding: 40px; color: var(--muted);">Loading your order details...</div>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/order.js"></script>
</body>
</html>
