<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Order Tracking — Barbeque Nation</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/menu.css">
  <style>
    .order-status-banner {
      padding: 16px;
      border-radius: var(--radius-md);
      text-align: center;
      margin-bottom: 24px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.02em;
    }
    .banner-new { background: rgba(52, 152, 219, 0.2); color: #74b9ff; border: 1.5px solid rgba(52, 152, 219, 0.45); }
    .banner-preparing { background: rgba(243, 156, 18, 0.2); color: #ffbe53; border: 1.5px solid rgba(243, 156, 18, 0.45); }
    .banner-ready { background: rgba(46, 204, 113, 0.2); color: #55efc4; border: 1.5px solid rgba(46, 204, 113, 0.45); }
    .banner-completed { background: rgba(149, 165, 166, 0.2); color: #dfe6e9; border: 1.5px solid rgba(149, 165, 166, 0.45); }
    .banner-cancelled { background: rgba(231, 76, 60, 0.2); color: #ff7675; border: 1.5px solid rgba(231, 76, 60, 0.45); }
    
    .tracking-brand-header {
      max-width: 640px;
      margin: 0 auto 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .tracking-logo {
      height: 56px;
      width: auto;
      filter: drop-shadow(0 3px 10px rgba(255, 99, 1, 0.3));
    }
  </style>
</head>
<body style="min-height: 100vh; padding: 24px 16px 60px;">

  <div class="tracking-brand-header">
    <a href="/" title="Back to Home">
      <img src="/images/bbq-logo.svg" alt="Barbeque Nation" class="tracking-logo">
    </a>
    <div>
      <h1 style="font-family: var(--font-sans); font-size: 26px; font-weight: 800; color: #111827; margin: 0;" id="resName">Barbeque Nation</h1>
      <p style="font-size: 13.5px; color: #FF6301; font-weight: 600; margin: 2px 0 0;" id="resOutlet">Live Order Tracking • Sentrum Mall, Asansol</p>
    </div>
  </div>

  <main class="order-tracking-card" id="trackingContainer">
    <div style="text-align:center; padding: 40px; color: var(--muted);">Loading your order details...</div>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/order.js"></script>
</body>
</html>
